services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: vps_manager
      POSTGRES_USER: vps_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
    volumes:
      - vps-manager-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vps_manager -d vps_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      target: api-runtime
    ports:
      - "3001:3000"
    environment:
      PORT: "3000"
      APP_MODE: demo
      ENABLE_WEB_TERMINAL: "false"
      ALLOW_PRIVATE_NETWORK_TARGETS: "false"
      DATA_DIR: /app/data
      PRIVATE_DIR: /app/private
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://vps_manager:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}@postgres:5432/vps_manager
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - vps-manager-data:/app/data
      - vps-manager-private:/app/private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      target: web-runtime
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  vps-manager-data:
  vps-manager-private:
  vps-manager-postgres:
