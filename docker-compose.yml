services:
  vps-manager:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      APP_MODE: demo
      LOCAL_AUTH_TOKEN: ""
      ENABLE_WEB_TERMINAL: "false"
      ALLOW_PRIVATE_NETWORK_TARGETS: "false"
      DATA_DIR: /app/data
      PRIVATE_DIR: /app/private
    volumes:
      - vps-manager-data:/app/data
      - vps-manager-private:/app/private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vps-manager-data:
  vps-manager-private:
