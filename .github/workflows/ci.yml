name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Typecheck Node workspaces
        run: npm run typecheck

      - name: Build Node app
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: packages/agent/go.mod

      - name: Test Go agent
        run: npm run test:agent

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api-runtime
          push: false
          load: true
          tags: vps-manager-nodejs-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test API runtime migration assets
        run: |
          docker run --rm --entrypoint sh vps-manager-nodejs-api:ci -lc '
            test -f /app/dist/db/migrate.js
            test -f /app/db/migrations/001_core_schema.sql
            test -f /app/db/migrations/002_metric_indexes.sql
            test -f /app/db/migrations/003_timescale_optional.sql
          '

      - name: Build web Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web-runtime
          push: false
          tags: vps-manager-nodejs-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish Docker image
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      api_sha_tag: ${{ steps.meta.outputs.api_sha_tag }}
      web_image: ${{ steps.meta.outputs.web_image }}
      web_sha_tag: ${{ steps.meta.outputs.web_sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        run: |
          BASE_IMAGE="${IMAGE_NAME,,}"
          API_IMAGE="${BASE_IMAGE}-api"
          WEB_IMAGE="${BASE_IMAGE}-web"
          API_SHA_TAG="$API_IMAGE:${GITHUB_SHA}"
          WEB_SHA_TAG="$WEB_IMAGE:${GITHUB_SHA}"
          {
            echo "api_image=$API_IMAGE"
            echo "api_sha_tag=$API_SHA_TAG"
            echo "web_image=$WEB_IMAGE"
            echo "web_sha_tag=$WEB_SHA_TAG"
          } >> "$GITHUB_OUTPUT"
          {
            echo "API_IMAGE=$API_IMAGE"
            echo "API_SHA_TAG=$API_SHA_TAG"
            echo "WEB_IMAGE=$WEB_IMAGE"
            echo "WEB_SHA_TAG=$WEB_SHA_TAG"
          } >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api-runtime
          push: true
          tags: |
            ${{ env.API_SHA_TAG }}
            ${{ env.API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=vps-manager-nodejs-api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web-runtime
          push: true
          tags: |
            ${{ env.WEB_SHA_TAG }}
            ${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=vps-manager-nodejs-web
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Check deploy configuration
        id: config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: set VPS_HOST, VPS_USER and VPS_SSH_KEY repository secrets to enable SSH deployment."
          fi
          echo "deploy_path=${DEPLOY_PATH:-/opt/vps-manager-nodejs}" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        if: steps.config.outputs.enabled == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add server host key
        if: steps.config.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy container
        if: steps.config.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ steps.config.outputs.deploy_path }}
          API_IMAGE: ${{ needs.publish.outputs.api_sha_tag }}
          WEB_IMAGE: ${{ needs.publish.outputs.web_sha_tag }}
          LOCAL_AUTH_TOKEN: ${{ secrets.LOCAL_AUTH_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "POSTGRES_PASSWORD repository secret is required for production deployment."
            exit 1
          fi
          SSH="ssh -i ~/.ssh/deploy_key -p ${VPS_PORT:-22} ${VPS_USER}@${VPS_HOST}"
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          $SSH "mkdir -p '$DEPLOY_PATH'"
          $SSH "cat > '$DEPLOY_PATH/docker-compose.yml'" <<EOF
          services:
            postgres:
              image: timescale/timescaledb:2.17.2-pg16
              restart: unless-stopped
              environment:
                POSTGRES_DB: vps_manager
                POSTGRES_USER: vps_manager
                POSTGRES_PASSWORD: "$POSTGRES_PASSWORD"
              volumes:
                - vps-manager-postgres:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U vps_manager -d vps_manager"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 10s
            api:
              image: $API_IMAGE
              restart: unless-stopped
              depends_on:
                postgres:
                  condition: service_healthy
              environment:
                PORT: "3000"
                APP_MODE: "local"
                LOCAL_AUTH_TOKEN: "$LOCAL_AUTH_TOKEN"
                DATA_DIR: /app/data
                PRIVATE_DIR: /app/private
                STORAGE_DRIVER: "postgres"
                DATABASE_URL: "postgres://vps_manager:$POSTGRES_PASSWORD@postgres:5432/vps_manager"
                ENABLE_WEB_TERMINAL: "false"
                ALLOW_PRIVATE_NETWORK_TARGETS: "false"
              volumes:
                - vps-manager-data:/app/data
                - vps-manager-private:/app/private
              healthcheck:
                test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 10s
            web:
              image: $WEB_IMAGE
              restart: unless-stopped
              ports:
                - "3000:80"
              depends_on:
                api:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 5s
          volumes:
            vps-manager-data:
            vps-manager-private:
            vps-manager-postgres:
          EOF
          $SSH "cd '$DEPLOY_PATH' && docker compose pull"
          $SSH "cd '$DEPLOY_PATH' && docker compose up -d postgres"
          $SSH "cd '$DEPLOY_PATH' && docker compose run --rm api node dist/db/migrate.js"
          $SSH "cd '$DEPLOY_PATH' && docker compose run --rm api node dist/db/migrate.js --include-optional" || echo "Optional Timescale migration failed or is unavailable; continuing with core PostgreSQL schema."
          $SSH "cd '$DEPLOY_PATH' && docker compose up -d --remove-orphans"
          $SSH "cd '$DEPLOY_PATH' && docker compose ps"
          $SSH "for i in \$(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && exit 0; sleep 2; done; docker compose -f '$DEPLOY_PATH/docker-compose.yml' logs --tail=80; exit 1"

